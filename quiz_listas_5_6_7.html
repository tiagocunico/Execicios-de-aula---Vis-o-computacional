<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Listas 5, 6 e 7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 32px 16px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: 1.8rem; color: #1a1a2e; }
    header p  { color: #555; margin-top: 6px; font-size: 0.95rem; }

    .question-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .question-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 16px;
      color: #1a1a2e;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .option:hover { border-color: #6c63ff; background: #f5f4ff; }

    .option .bubble {
      width: 20px; height: 20px; min-width: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      transition: border-color 0.15s, background 0.15s;
    }

    .option .bubble::after {
      content: '';
      width: 10px; height: 10px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.15s;
    }

    .option.selected { border-color: #6c63ff; background: #f5f4ff; }
    .option.selected .bubble { border-color: #6c63ff; }
    .option.selected .bubble::after { background: #6c63ff; }

    .option.correct  { border-color: #27ae60 !important; background: #eafaf1 !important; }
    .option.correct .bubble { border-color: #27ae60 !important; }
    .option.correct .bubble::after { background: #27ae60 !important; }

    .option.wrong    { border-color: #e74c3c !important; background: #fdf0ee !important; }
    .option.wrong .bubble { border-color: #e74c3c !important; }
    .option.wrong .bubble::after { background: #e74c3c !important; }

    .option.reveal   { border-color: #27ae60 !important; background: #eafaf1 !important; }
    .option.reveal .bubble { border-color: #27ae60 !important; }
    .option.reveal .bubble::after { background: #27ae60 !important; }

    .option-text { font-size: 0.95rem; line-height: 1.5; }

    .feedback {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct-fb { background: #eafaf1; color: #1e8449; border-left: 4px solid #27ae60; }
    .feedback.wrong-fb   { background: #fdf0ee; color: #c0392b; border-left: 4px solid #e74c3c; }

    .check-btn {
      margin-top: 16px;
      padding: 9px 22px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .check-btn:hover { background: #574fd6; }
    .check-btn:disabled { background: #bbb; cursor: default; }

    .score-bar {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-top: 12px;
      display: none;
    }
    .score-bar h2 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 8px; }
    .score-bar .score-num { font-size: 3rem; font-weight: 800; color: #6c63ff; }
    .score-bar p { color: #555; margin-top: 8px; }

    .submit-all {
      display: block;
      width: 100%;
      padding: 14px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .submit-all:hover { background: #2d2d5e; }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .tag-5 { background: #dbeafe; color: #1d4ed8; }
    .tag-6 { background: #fce7f3; color: #9d174d; }
    .tag-7 { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Quiz — Listas 5, 6 e 7</h1>
    <p>Visão Computacional · AUT0237 · Selecione sua resposta e clique em Verificar</p>
  </header>

  <div id="quiz-root"></div>
  <button class="submit-all" onclick="showScore()">Ver Resultado Final</button>
  <div class="score-bar" id="scorebar">
    <h2>Resultado</h2>
    <div class="score-num" id="scorenum"></div>
    <p id="scoremsg"></p>
  </div>
</div>

<script>
// =====================================================================
// BANCO DE QUESTÕES — para adicionar uma questão, basta copiar um bloco
// abaixo e preencher: lista, question, options (a/b/c/d), correct, explanation
// =====================================================================
const QUESTIONS = [
  {
    lista: '5',
    question: 'Como você distingue ruído gaussiano de ruído uniforme olhando apenas o histograma da imagem?',
    options: {
      a: 'O gaussiano forma um bloco plano e o uniforme forma uma curva em sino.',
      b: 'O gaussiano forma uma curva em sino centrada num valor; o uniforme forma um bloco plano com valores equiprováveis.',
      c: 'Os dois formam a mesma curva, só diferem na largura.',
      d: 'O gaussiano tem picos em 0 e 255; o uniforme tem pico no centro.'
    },
    correct: 'b',
    explanation: 'O ruído gaussiano tem distribuição normal (sino), concentrado em torno de um valor médio. O ruído uniforme distribui a energia igualmente num intervalo, formando o bloco plano no histograma.'
  },
  {
    lista: '5',
    question: 'Entre os filtros de média aritmética, geométrica e harmônica, qual tende a borrar mais a imagem?',
    options: {
      a: 'Harmônica, pois inverte os valores dos pixels antes de calcular.',
      b: 'Geométrica, pois multiplica todos os vizinhos.',
      c: 'Aritmética, pois faz a média simples de todos os vizinhos sem distinção, suavizando bordas indiscriminadamente.',
      d: 'Todas borram igualmente.'
    },
    correct: 'c',
    explanation: 'A média aritmética soma todos os vizinhos e divide pelo total. Isso inclui pixels muito diferentes do centro no cálculo, espalhando valores abruptamente e borrando as bordas.'
  },
  {
    lista: '5',
    question: 'Por que o filtro de mediana é superior aos filtros de média para remover ruído sal-e-pimenta?',
    options: {
      a: 'Porque calcula a média apenas dos pixels mais escuros da janela.',
      b: 'Porque descarta os valores extremos ao escolher o valor central da janela ordenada, sem espalhar o ruído.',
      c: 'Porque usa uma janela maior que os filtros de média.',
      d: 'Porque aplica um limiar antes de calcular.'
    },
    correct: 'b',
    explanation: 'O ruído sal-e-pimenta cria pixels com valores extremos (0 ou 255). A mediana ordena os vizinhos e pega o do meio — os extremos ficam nas pontas da lista e são ignorados. Os filtros de média incluem esses extremos e os espalham pela imagem.'
  },
  {
    lista: '5',
    question: 'No exercício 6 da Lista 5 a filtragem inversa funciona bem, mas no exercício 7 ela falha completamente. O que muda entre os dois exercícios?',
    options: {
      a: 'O exercício 7 usa uma janela de borramento maior.',
      b: 'O exercício 7 usa uma imagem diferente.',
      c: 'O exercício 7 adiciona ruído gaussiano após o borramento, e a divisão por H amplifica esse ruído nas altas frequências de forma catastrófica.',
      d: 'O exercício 7 não aplica o borramento antes da filtragem inversa.'
    },
    correct: 'c',
    explanation: 'A filtragem inversa divide G por H no domínio da frequência. O filtro de média H tem valores próximos de zero nas altas frequências. Quando existe ruído N, a equação vira F + N/H — e N dividido por valores perto de zero explode, destruindo a imagem.'
  },
  {
    lista: '5',
    question: 'Por que para estimar o ruído de uma imagem usamos o histograma de uma região homogênea (fundo plano) em vez da imagem inteira?',
    options: {
      a: 'Porque o histograma da imagem inteira é muito lento de calcular.',
      b: 'Numa região plana, sem textura, toda variação de intensidade se deve exclusivamente ao ruído — isolando sua assinatura sem misturar com variações da cena.',
      c: 'Porque o ruído só aparece nas bordas dos objetos, e o fundo não tem bordas.',
      d: 'Porque regiões com textura têm ruído menor e atrapalhariam o cálculo.'
    },
    correct: 'b',
    explanation: 'Em uma região plana ideal, todos os pixels deveriam ter o mesmo valor. Qualquer variação que aparece ali é causada pelo ruído. Na imagem inteira, a variação de intensidade mistura ruído com textura e bordas dos objetos, tornando impossível separar um do outro.'
  },
  {
    lista: '5',
    question: 'O filtro de média geométrica usa um truque com logaritmo para evitar estouro numérico. Qual é a equivalência matemática usada?',
    options: {
      a: 'Média Geométrica = log( Soma dos pixels )',
      b: 'Média Geométrica = exp( Média Aritmética dos log dos pixels )',
      c: 'Média Geométrica = log( Produto dos pixels ) / N',
      d: 'Média Geométrica = sqrt( Média Aritmética dos pixels ao quadrado )'
    },
    correct: 'b',
    explanation: 'Calcular 255^25 estoura qualquer variável. O truque: log(a×b) = log(a)+log(b). Então o produto de N pixels vira uma soma de logaritmos. Tirando a média dessa soma e aplicando exp() no final, obtemos a média geométrica sem nunca multiplicar diretamente os valores.'
  },
  {
    lista: '5',
    question: 'Na filtragem inversa do exercício 6, por que é necessário usar um limiar (limiar = 0.05) ao dividir por H?',
    options: {
      a: 'Para limitar o brilho máximo da imagem recuperada a 5% do valor original.',
      b: 'Para evitar divisão por zero ou por valores muito próximos de zero, que amplificariam o ruído infinitamente nas altas frequências.',
      c: 'Para remover as baixas frequências da imagem antes da recuperação.',
      d: 'Para garantir que a FFT seja calculada apenas nas frequências relevantes.'
    },
    correct: 'b',
    explanation: 'O filtro de média H bloqueia as altas frequências, fazendo H ≈ 0 nelas. Dividir qualquer valor por 0 gera infinito. O limiar cria uma máscara: só divide onde |H| > 0.05, ignorando frequências onde H é tão pequeno que a divisão destruiria a imagem.'
  },
  {
    lista: '5',
    question: 'O filtro de média geométrica é bom para remover qual tipo específico de ruído, e por quê é péssimo para o oposto?',
    options: {
      a: 'Bom para ruído gaussiano; ruim para ruído uniforme.',
      b: 'Bom para ruído "sal" (pixels brancos); ruim para ruído "pimenta" (pixels pretos), pois valores próximos de zero puxam o produto — e a média geométrica — para zero.',
      c: 'Bom para ruído "pimenta" (pixels pretos); ruim para ruído "sal" (pixels brancos).',
      d: 'Bom para qualquer tipo de ruído impulsivo.'
    },
    correct: 'b',
    explanation: 'A média geométrica é uma multiplicação. Um pixel branco (valor alto) na janela eleva o produto, mas não tanto. Já um pixel preto (valor ≈ 0) multiplica todo o produto por quase zero, escurecendo dramaticamente aquela região. Por isso funciona para sal mas destrói imagens com pimenta.'
  },
  {
    lista: '6',
    question: 'Por que converter a imagem de teste de daltonismo para tons de cinza não resolve o problema do daltônico?',
    options: {
      a: 'Porque daltônicos não enxergam em tons de cinza.',
      b: 'Porque a conversão para cinza depende apenas do canal azul.',
      c: 'Vermelho e verde podem ter a mesma luminosidade, resultando no mesmo tom de cinza e mantendo a informação inacessível.',
      d: 'Porque a imagem cbt.bmp não tem canal verde.'
    },
    correct: 'c',
    explanation: 'A conversão para cinza usa uma ponderação de luminosidade (ex: 0.299R + 0.587G + 0.114B). Se um objeto vermelho e um verde tiverem brilho similar, o resultado em cinza será praticamente igual — a distinção de cor se perde por completo.'
  },
  {
    lista: '6',
    question: 'No exercício 2 da Lista 6, como o código separa objetos vermelhos de verdes numericamente?',
    options: {
      a: 'Converte para HSV e separa pelo canal de matiz (Hue).',
      b: 'Usa a diferença entre os canais R e G: pixels onde (R - G) > limiar são vermelhos; onde (G - R) > limiar são verdes.',
      c: 'Compara o canal R com um valor fixo de 128: acima é vermelho, abaixo é verde.',
      d: 'Usa o canal azul como referência: onde B é baixo, o pixel é vermelho ou verde.'
    },
    correct: 'b',
    explanation: 'O código calcula mask_vermelho = (R - G) > 15 e mask_verde = (G - R) > 15. A diferença entre canais captura a dominância cromática sem depender do brilho absoluto — por isso funciona mesmo quando os objetos têm luminâncias parecidas, que é exatamente o que confunde o daltônico.'
  },
  {
    lista: '6',
    question: 'O que é protanopia e deuteranopia, e por que ambas causam confusão entre vermelho e verde?',
    options: {
      a: 'Protanopia é daltonismo total (visão em preto e branco); deuteranopia é sensibilidade reduzida ao azul.',
      b: 'Protanopia é ausência dos cones sensíveis ao vermelho (L); deuteranopia é ausência dos cones sensíveis ao verde (M). Sem um dos dois, o cérebro não consegue distinguir os dois matizes.',
      c: 'Protanopia afeta apenas homens; deuteranopia afeta apenas mulheres.',
      d: 'As duas são o mesmo tipo de daltonismo, apenas com nomenclaturas diferentes para graus de severidade.'
    },
    correct: 'b',
    explanation: 'O olho humano tem 3 tipos de cones: S (azul), M (verde) e L (vermelho). A protanopia é a ausência dos cones L; a deuteranopia, dos cones M. Sem um dos dois, o sinal que o cérebro recebe para distinguir verde de vermelho é ambíguo — ambas as cores produzem resposta similar nos cones restantes.'
  },
  {
    lista: '7',
    question: 'Qual é a diferença fundamental entre erosão e dilatação em termos de lógica booleana?',
    options: {
      a: 'Erosão usa OR (basta um vizinho ser branco); dilatação usa AND (todos os vizinhos precisam ser brancos).',
      b: 'Erosão usa AND (todos os vizinhos precisam ser brancos); dilatação usa OR (basta um vizinho ser branco).',
      c: 'As duas usam AND, mas com elementos estruturantes diferentes.',
      d: 'As duas usam OR, mas a erosão inverte a imagem antes.'
    },
    correct: 'b',
    explanation: 'Na erosão, o pixel de saída só é 1 se TODOS os vizinhos definidos pelo SE forem 1 (AND). Na dilatação, basta que pelo menos UM vizinho seja 1 (OR). Por isso a erosão encolhe e a dilatação expande.'
  },
  {
    lista: '7',
    question: 'Por que a abertura não fecha as fendas do texto, mas o fechamento consegue?',
    options: {
      a: 'A abertura usa um elemento estruturante menor que o fechamento.',
      b: 'Na abertura a erosão roda primeiro e aumenta as fendas; no fechamento a dilatação roda primeiro e preenche as fendas antes da erosão restaurar o contorno.',
      c: 'A abertura só funciona em imagens coloridas.',
      d: 'O fechamento aplica a operação mais vezes que a abertura.'
    },
    correct: 'b',
    explanation: 'Abertura = Erosão → Dilatação. A erosão amplia os gaps e a dilatação só restaura o que restou. Fechamento = Dilatação → Erosão. A dilatação cria pontes sólidas nos gaps; a erosão encolhe de volta mas as pontes sobrevivem.'
  },
  {
    lista: '7',
    question: 'Por que o padding da erosão é preenchido com 1 (true) enquanto o da dilatação é preenchido com 0 (false)?',
    options: {
      a: 'É uma convenção arbitrária sem efeito prático.',
      b: 'Na erosão, padding 0 faria as bordas da imagem serem erodidas como se houvesse pixels pretos ao redor. Na dilatação, padding 1 expandiria objetos a partir do nada fora dos limites.',
      c: 'O padding da erosão precisa ser 1 para aumentar o tamanho da imagem de saída.',
      d: 'O padding apenas serve para evitar erros de índice e o valor não importa.'
    },
    correct: 'b',
    explanation: 'O valor do padding precisa ser o elemento neutro da operação. AND com 1 não afeta o resultado (neutro da erosão). OR com 0 não afeta o resultado (neutro da dilatação). Usar o valor errado distorceria o comportamento nas bordas da imagem.'
  },
  {
    lista: '7',
    question: 'Qual operação morfológica você usaria para remover pequenos pontos de ruído isolados (sem afetar os objetos maiores) e por quê?',
    options: {
      a: 'Fechamento, pois preenche os buracos deixados pelo ruído.',
      b: 'Dilatação, pois expande os objetos e encobre o ruído ao redor.',
      c: 'Abertura, pois a erosão elimina os pontos pequenos e a dilatação subsequente restaura o tamanho dos objetos grandes que sobreviveram.',
      d: 'Erosão simples, pois encolhe tudo uniformemente incluindo o ruído.'
    },
    correct: 'c',
    explanation: 'A abertura (erosão → dilatação) é a ferramenta certa: a erosão destrói os pontos pequenos que não cabem dentro do elemento estruturante, enquanto os objetos grandes apenas encolhem. A dilatação seguinte os restaura ao tamanho original. Os pontinhos de ruído, já destruídos, não voltam.'
  }
];

// =====================================================================
// GERAÇÃO AUTOMÁTICA DO HTML — não precisa mexer aqui
// =====================================================================
const state = { answers: {}, correct: {} };
const total = QUESTIONS.length;

function buildQuiz() {
  const root = document.getElementById('quiz-root');
  QUESTIONS.forEach((q, i) => {
    const n = i + 1;
    const qid = `q${n}`;
    const optionsHTML = Object.entries(q.options).map(([key, text]) => `
      <label class="option" onclick="selectOption('${qid}','${key}',this)">
        <div class="bubble"></div>
        <span class="option-text">${text}</span>
      </label>`).join('');

    root.innerHTML += `
      <div class="question-card" id="${qid}">
        <div class="question-label">Questão ${n} de ${total}</div>
        <span class="tag tag-${q.lista}">Lista ${q.lista}</span>
        <div class="question-text">${q.question}</div>
        <div class="options">${optionsHTML}</div>
        <div class="feedback" id="fb${n}"></div>
        <button class="check-btn" id="btn${n}" onclick="check('${qid}','${q.correct}',\`${q.explanation}\`)">Verificar</button>
      </div>`;
  });
}

function selectOption(qid, value, el) {
  if (state.correct[qid]) return;
  document.querySelectorAll(`#${qid} .option`).forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.answers[qid] = value;
}

function check(qid, correctVal, explanation) {
  const n = qid.slice(1);
  const btn = document.getElementById(`btn${n}`);
  const fb  = document.getElementById(`fb${n}`);
  const selected = state.answers[qid];

  if (!selected) {
    fb.textContent = 'Selecione uma alternativa primeiro.';
    fb.className = 'feedback show wrong-fb';
    return;
  }

  state.correct[qid] = correctVal;
  btn.disabled = true;

  document.querySelectorAll(`#${qid} .option`).forEach(opt => {
    opt.style.pointerEvents = 'none';
    const optVal = opt.querySelector('.option-text').closest('label').getAttribute('onclick').match(/'([a-d])'/)[1];
    if (optVal === correctVal && selected !== correctVal) opt.classList.add('reveal');
  });

  const chosen = [...document.querySelectorAll(`#${qid} .option`)]
    .find(o => o.getAttribute('onclick').includes(`'${selected}'`));

  if (selected === correctVal) {
    chosen.classList.add('correct');
    fb.innerHTML = `<strong>Correto!</strong> ${explanation}`;
    fb.className = 'feedback show correct-fb';
  } else {
    chosen.classList.add('wrong');
    fb.innerHTML = `<strong>Incorreto.</strong> ${explanation}`;
    fb.className = 'feedback show wrong-fb';
  }
}

function showScore() {
  let score = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = `q${i + 1}`;
    if (state.answers[qid] && state.correct[qid] && state.answers[qid] === state.correct[qid]) score++;
  });
  const bar = document.getElementById('scorebar');
  document.getElementById('scorenum').textContent = `${score} / ${total}`;
  const msgs = [
    'Continue estudando, você consegue!',
    'Está no caminho certo, revise os pontos errados.',
    'Bom resultado! Revise os detalhes.',
    'Muito bom! Está bem preparado.',
    'Perfeito! Domínio completo do conteúdo.'
  ];
  document.getElementById('scoremsg').textContent = msgs[Math.floor((score / total) * (msgs.length - 1))];
  bar.style.display = 'block';
  bar.scrollIntoView({ behavior: 'smooth' });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

shuffle(QUESTIONS);
buildQuiz();
</script>
</body>
</html>
